name: Analyze reference videos

# Measures cuts, captions, sound and visuals. Files are kept only 1 day because this repo is public.
on:
  workflow_dispatch:
    inputs:
      videos:
        description: "label=DriveFileId pairs, separated by spaces (e.g. r1=abc r2=def)"
        required: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VIDEOS: ${{ github.event.inputs.videos }}
      RCLONE_CONFIG_GD_TYPE: drive
      RCLONE_CONFIG_GD_SCOPE: drive
      GD_CID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GD_CSEC: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GD_RT: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg rclone
          pip install -q "scenedetect[opencv-headless]==0.7.2" faster-whisper

      - name: Analyze each video
        run: |
          export RCLONE_CONFIG_GD_CLIENT_ID=$(printf '%s' "$GD_CID" | tr -d '[:space:]"')
          export RCLONE_CONFIG_GD_CLIENT_SECRET=$(printf '%s' "$GD_CSEC" | tr -d '[:space:]"')
          RT=$(printf '%s' "$GD_RT" | tr -d '[:space:]"{}')
          export RCLONE_CONFIG_GD_TOKEN="{\"access_token\":\"\",\"token_type\":\"Bearer\",\"refresh_token\":\"$RT\",\"expiry\":\"2000-01-01T00:00:00Z\"}"
          for pair in $VIDEOS; do
            L="${pair%%=*}"; ID="${pair#*=}"
            D="out/$L"; mkdir -p "$D"
            echo "=== $L"
            rclone backend copyid GD: "$ID" "$D/raw.mp4" --drive-acknowledge-abuse
            ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate,duration:format=duration,size -of default=nw=1 "$D/raw.mp4" > "$D/info.txt"
            DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$D/raw.mp4")

            # 30 frames across the whole video
            STEP=$(python -c "print(max(0.2,round(float('$DUR')/30,3)))")
            ffmpeg -nostdin -loglevel error -y -i "$D/raw.mp4" -vf "fps=1/$STEP,scale=240:-2,tile=10x3:padding=4" -frames:v 1 -q:v 3 "$D/sheet.jpg" || true
            # 6 frames a second for 4 seconds from 25% in: shows how captions and graphics move
            START=$(python -c "print(round(float('$DUR')*0.25,2))")
            ffmpeg -nostdin -loglevel error -y -ss "$START" -t 4 -i "$D/raw.mp4" -vf "fps=6,scale=200:-2,tile=8x3:padding=3" -frames:v 1 -q:v 3 "$D/motion.jpg" || true
            # 4 full-size looks at the type
            for p in 15 40 60 85; do
              T=$(python -c "print(round(float('$DUR')*$p/100,2))")
              ffmpeg -nostdin -loglevel error -y -ss "$T" -i "$D/raw.mp4" -frames:v 1 -vf "scale=540:-2" -q:v 3 "$D/look_$p.jpg" || true
            done

            scenedetect -q -i "$D/raw.mp4" -o "$D/sc" detect-adaptive list-scenes -f scenes > /dev/null 2>&1 || true
            [ -f "$D/sc/scenes.csv" ] && cp "$D/sc/scenes.csv" "$D/scenes.csv"
            rm -rf "$D/sc"

            ffmpeg -nostdin -hide_banner -nostats -i "$D/raw.mp4" -af ebur128=peak=true -f null - 2>&1 | tail -14 > "$D/loudness.txt" || true
            ffmpeg -nostdin -hide_banner -nostats -i "$D/raw.mp4" -af silencedetect=noise=-35dB:d=0.3 -f null - 2>&1 | grep -E "silence_(start|end)" | sed 's/.*silence_/silence_/' > "$D/silences.txt" || true
            ffmpeg -nostdin -loglevel error -y -i "$D/raw.mp4" -vn -ac 1 -ar 16000 "$D/audio.wav" || true

            rm -f "$D/raw.mp4"
          done

      - name: Transcribe
        run: |
          python - <<'PY'
          import glob, json, os, wave
          import numpy as np
          from faster_whisper import WhisperModel
          m = WhisperModel("small", device="cpu", compute_type="int8")
          for p in sorted(glob.glob("out/*/audio.wav")):
              d = os.path.dirname(p)
              with wave.open(p) as wf:
                  a = np.frombuffer(wf.readframes(wf.getnframes()), dtype=np.int16).astype(np.float32) / 32768.0
              segs, info = m.transcribe(a, word_timestamps=True, vad_filter=True)
              words, lines = [], []
              for s in segs:
                  lines.append({"start": round(s.start, 2), "end": round(s.end, 2), "text": s.text.strip()})
                  for w in (s.words or []):
                      words.append({"t": w.word.strip(), "s": round(w.start, 2), "e": round(w.end, 2)})
              json.dump({"language": info.language, "lang_prob": round(info.language_probability, 2), "lines": lines, "words": words}, open(d + "/transcript.json", "w"), ensure_ascii=False)
              print(d, info.language, len(words), "words")
              os.remove(p)
          PY
          du -sh out/*

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: analysis
          path: out
          retention-days: 1
