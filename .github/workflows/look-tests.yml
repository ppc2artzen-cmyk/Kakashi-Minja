name: Render look tests

# Short real renders so a look can be approved before the full edit. Files are kept 1 day: this repo is public.
on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "Google Drive file ID of the raw video"
        required: true
      start:
        description: "Start of the moment, in seconds"
        required: true
        default: "10.9"
      looks:
        description: "Folder names under templates/look-tests, separated by spaces"
        required: true
        default: "a-billboard b-editorial c-paper-pop d-dark-glass"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HYPERFRAMES_NO_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      FILE_ID: ${{ github.event.inputs.drive_file_id }}
      START: ${{ github.event.inputs.start }}
      LOOKS: ${{ github.event.inputs.looks }}
      RCLONE_CONFIG_GD_TYPE: drive
      RCLONE_CONFIG_GD_SCOPE: drive
      GD_CID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GD_CSEC: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GD_RT: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg rclone
          echo "CPUs: $(nproc)"

      - name: Cut the moment from Drive
        run: |
          export RCLONE_CONFIG_GD_CLIENT_ID=$(printf '%s' "$GD_CID" | tr -d '[:space:]"')
          export RCLONE_CONFIG_GD_CLIENT_SECRET=$(printf '%s' "$GD_CSEC" | tr -d '[:space:]"')
          RT=$(printf '%s' "$GD_RT" | tr -d '[:space:]"{}')
          export RCLONE_CONFIG_GD_TOKEN="{\"access_token\":\"\",\"token_type\":\"Bearer\",\"refresh_token\":\"$RT\",\"expiry\":\"2000-01-01T00:00:00Z\"}"
          mkdir -p work out
          rclone backend copyid GD: "$FILE_ID" work/raw.mp4 --drive-acknowledge-abuse
          ffmpeg -nostdin -loglevel error -y -ss "$START" -t 5.7 -i work/raw.mp4 -vf "scale=1080:1920:flags=lanczos" -r 30 -c:v libx264 -crf 16 -pix_fmt yuv420p -af "loudnorm=I=-16:TP=-3" -c:a aac -b:a 192k work/clip.mp4

      - name: Cut the speaker out of the background
        run: |
          time npx -y hyperframes@0.8.226 remove-background work/clip.mp4 -o work/cutout.webm --device cpu
          ls -l work

      - name: Render each look
        run: |
          for L in $LOOKS; do
            D="templates/look-tests/$L"
            mkdir -p "$D/assets"
            cp work/clip.mp4 work/cutout.webm "$D/assets/"
            cp -r templates/look-tests/fonts "$D/assets/fonts"
            echo "=== $L"
            npx -y hyperframes@0.8.226 check "$D" --json > "out/$L.check.json" || true
            S=$(date +%s)
            npx -y hyperframes@0.8.226 render "$D" -o "out/$L.mp4" --quality looks
            echo "$L render seconds: $(( $(date +%s) - S ))"
            ffmpeg -nostdin -loglevel error -y -i "out/$L.mp4" -vf "select='eq(n\,30)+eq(n\,48)+eq(n\,75)+eq(n\,125)+eq(n\,160)',scale=360:-2,tile=5x1:padding=6" -vsync 0 -frames:v 1 -q:v 3 "out/$L.jpg"
          done
          ls -l out

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: look-tests
          path: out
          retention-days: 1
