name: Render stills storyboard

# Stills only: color, layout, images and text. No motion and no sound. Files are kept 1 day: this repo is public.
on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "Google Drive file ID of the raw video"
        required: true

permissions:
  contents: read

jobs:
  stills:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HYPERFRAMES_NO_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      FILE_ID: ${{ github.event.inputs.drive_file_id }}
      P: templates/premium-storyboard
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      RCLONE_CONFIG_GD_TYPE: drive
      RCLONE_CONFIG_GD_SCOPE: drive
      GD_CID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GD_CSEC: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GD_RT: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg rclone fonts-noto-color-emoji

      - name: Download the video
        run: |
          export RCLONE_CONFIG_GD_CLIENT_ID=$(printf '%s' "$GD_CID" | tr -d '[:space:]"')
          export RCLONE_CONFIG_GD_CLIENT_SECRET=$(printf '%s' "$GD_CSEC" | tr -d '[:space:]"')
          RT=$(printf '%s' "$GD_RT" | tr -d '[:space:]"{}')
          export RCLONE_CONFIG_GD_TOKEN="{\"access_token\":\"\",\"token_type\":\"Bearer\",\"refresh_token\":\"$RT\",\"expiry\":\"2000-01-01T00:00:00Z\"}"
          mkdir -p work "$P/assets/fonts" out/stills out/color
          rclone backend copyid GD: "$FILE_ID" work/raw.mp4 --drive-acknowledge-abuse

      - name: Download stock images
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          key = os.environ["PIXABAY_API_KEY"].strip()
          want = {"rupee": 4398432, "hand": 2459328, "sad": 10202054}
          for name, i in want.items():
              u = "https://pixabay.com/api/?" + urllib.parse.urlencode({"key": key, "id": i})
              d = json.load(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "kakashi-minja"}), timeout=30))
              x = d["hits"][0]
              req = urllib.request.Request(x["largeImageURL"], headers={"User-Agent": "kakashi-minja"})
              open(f"work/{name}.jpg", "wb").write(urllib.request.urlopen(req, timeout=60).read())
              print(name, i, x["imageWidth"], x["imageHeight"], x["pageURL"])
          PY
          cp work/rupee.jpg work/hand.jpg "$P/assets/"
          cp templates/look-tests/fonts/anton-latin-400-normal.woff2 templates/look-tests/fonts/sora-latin-800-normal.woff2 "$P/assets/fonts/"

      - name: Pick the sharpest frame, track the face, match color
        run: |
          pip install -q "opencv-python-headless==4.10.0.84" "numpy<2"
          python3 - <<'PY'
          import cv2, json, os
          P = os.environ["P"]
          plan = json.load(open(f"{P}/plan.json"))
          cap = cv2.VideoCapture("work/raw.mp4")
          fps = cap.get(cv2.CAP_PROP_FPS)
          face = cv2.CascadeClassifier(cv2.data.haarcascades + "haarcascade_frontalface_default.xml")
          eyes = cv2.CascadeClassifier(cv2.data.haarcascades + "haarcascade_eye.xml")
          out = []
          faces = {}
          for i, b in enumerate(plan["beats"]):
              take = next(k for k in plan["takes"] if k["from"] <= b["t"] < k["to"])
              best = None
              for off in [x * 0.05 for x in range(-10, 11)]:
                  t = b["t"] + off
                  if not take["from"] + 0.03 <= t < take["to"] - 0.03: continue
                  cap.set(cv2.CAP_PROP_POS_MSEC, t * 1000)
                  ok, fr = cap.read()
                  if not ok: continue
                  g = cv2.cvtColor(fr, cv2.COLOR_BGR2GRAY)
                  fs = face.detectMultiScale(cv2.resize(g, (960, 540)), 1.1, 6, minSize=(50, 50))
                  if not len(fs): continue
                  x, y, w, h = max(fs, key=lambda r: r[2] * r[3])
                  c = g[max(0, y * 2):(y + h) * 2, max(0, x * 2):(x + w) * 2]
                  sharp = cv2.Laplacian(c, cv2.CV_64F).var() - abs(off) * 30
                  # prefer open eyes: two eyes found in the top half of the face
                  n_eyes = len(eyes.detectMultiScale(c[: c.shape[0] // 2 + 10], 1.1, 6, minSize=(24, 24)))
                  if n_eyes >= 2: sharp += 120
                  if best is None or sharp > best[0]:
                      best = (sharp, t, (x + w / 2) * 2, y * 2, h * 2)
              if best is None:
                  best = (0, b["t"], take["cx"] * 1920, 260, 330)
                  print("no face found, using default", i)
              cx = int(min(1920 - 608, max(0, best[2] - 304)))
              r, g2, bl = take["gains"]
              s = 1080 / 608
              faces[i] = {"cx": (best[2] - cx) * s, "top": best[3] * s, "h": best[4] * s}
              html = open(f"{P}/index.html").read().replace(f"PIPTOP{i}px", f"{round(190 - (best[3] + best[4] / 2) * s * 640 / 1080)}px")
              open(f"{P}/index.html", "w").write(html)
              out.append(f"{i} {best[1]:.3f} {cx} {r} {g2} {bl}")
              print(b["name"], "time", round(best[1], 2), "crop x", cx, "sharp", round(best[0]))
          open("work/beats.txt", "w").write("\n".join(out) + "\n")
          json.dump(faces, open("work/faces.json", "w"))
          PY
          while read i t x r g b; do
            ffmpeg -nostdin -loglevel error -y -ss "$t" -i work/raw.mp4 -frames:v 1 -vf "crop=608:1080:$x:0,scale=1080:1920:flags=lanczos,colorchannelmixer=rr=$r:gg=$g:bb=$b,eq=contrast=1.05:saturation=1.03,selectivecolor=cyans=0.2 0 0 0" -q:v 2 "$P/assets/f$i.jpg"
            ffmpeg -nostdin -loglevel error -y -ss "$t" -i work/raw.mp4 -frames:v 1 -vf "crop=608:1080:$x:0,scale=540:-2" -q:v 3 "out/color/before_$i.jpg"
            ffmpeg -nostdin -loglevel error -y -i "$P/assets/f$i.jpg" -vf "scale=540:-2" -q:v 3 "out/color/after_$i.jpg"
          done < work/beats.txt

      - name: Cut the speaker out of each still
        run: |
          S=$(date +%s)
          while read i t x r g b; do
            npx -y hyperframes@0.8.226 remove-background "$P/assets/f$i.jpg" -o "$P/assets/c$i.png" --device cpu < /dev/null
          done < work/beats.txt
          npx -y hyperframes@0.8.226 remove-background work/sad.jpg -o "$P/assets/sad.png" --device cpu
          # Keep only the area around the real face, so faces in the background are not treated as the speaker
          python3 - <<'PY'
          import cv2, json, numpy as np, os
          P = os.environ["P"]
          for i, f in json.load(open("work/faces.json")).items():
              path = f"{P}/assets/c{i}.png"
              im = cv2.imread(path, cv2.IMREAD_UNCHANGED)
              H, W = im.shape[:2]
              m = np.ones((H, W), np.float32)
              top = int(f["top"] - 0.45 * f["h"])
              m[: max(0, top)] = 0
              shoulder = int(f["top"] + 1.25 * f["h"])
              half = 0.82 * f["h"]
              xs = np.arange(W)
              m[:shoulder, np.abs(xs - f["cx"]) > half] = 0
              m = cv2.GaussianBlur(m, (31, 31), 0)
              im[:, :, 3] = (im[:, :, 3] * m).astype(np.uint8)
              cv2.imwrite(path, im)
          PY
          echo "Cutout seconds: $(( $(date +%s) - S ))"

      - name: Render the stills
        run: |
          S=$(date +%s)
          npx -y hyperframes@0.8.226 check "$P" --json > out/check.json || true
          AT=$(node -e 'const p=require(process.env.P.replace(/^/,"./")+"/plan.json");console.log(p.beats.map((_,i)=>(i+0.5).toFixed(1)).join(","))')
          npx -y hyperframes@0.8.226 snapshot "$P" --at "$AT"
          cp "$P"/.hyperframes/artifacts/snapshots/*.png out/stills/ || find "$P" -name '*.png' -path '*snapshot*' -exec cp {} out/stills/ \;
          ls out/stills | head -20
          echo "Stills seconds: $(( $(date +%s) - S ))"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: premium-storyboard
          path: out
          retention-days: 1
